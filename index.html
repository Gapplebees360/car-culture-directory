  <title>USA Auto Meets | National Car Meets, Shows & Track Day Directory</title>
  <meta name="description" content="Find upcoming car meets, cars and coffee, drag racing, track days, and auto shows across all 50 states.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --text-primary: #f0f2f5;
      --text-secondary: #9ba1b0;
      --badge-bg: #212530;
      --input-bg: #1c1f2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(180deg, #181b24 0%, var(--bg-color) 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 40px 20px 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent-red);
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto 20px;
    }

    .header-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--accent-red);
      color: #ffffff;
      border-color: var(--accent-red);
    }

    .btn-primary:hover {
      background-color: var(--accent-red-hover);
    }

    .btn-secondary {
      background-color: #212530;
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: #2e3444;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Controls & Filters Bar */
    .filter-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      margin: 30px 0;
    }

    @media (max-width: 900px) {
      .filter-bar {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .filter-bar {
        grid-template-columns: 1fr;
      }
    }

    .filter-bar input, .filter-bar select {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .filter-bar input:focus, .filter-bar select:focus {
      border-color: var(--accent-red);
    }

    .stats-summary {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Event Grid */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      gap: 24px;
    }

    .event-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-4px);
      border-color: #3b4254;
    }

    .card-image-wrapper {
      position: relative;
      width: 100%;
      height: 190px;
      background-color: #1a1d26;
      overflow: hidden;
    }

    .event-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: var(--accent-red);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .event-card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .event-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .meta-row strong {
      color: var(--text-primary);
    }

    .event-description {
      font-size: 0.88rem;
      color: #8a90a0;
      margin: 12px 0 18px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }

    .event-link-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 10px 16px;
      background-color: #212530;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .event-link-btn:hover {
      background-color: var(--accent-red);
      border-color: var(--accent-red);
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      color: var(--text-secondary);
    }

    footer {
      text-align: center;
      padding: 40px 20px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .btn-action:disabled { opacity: 0.65; cursor: not-allowed; }
    .stats-summary { gap: 12px; flex-wrap: wrap; }
    :focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .event-card:hover { transform: none; }
    }
  </style>
</head>

    const DEFAULT_FALLBACK_IMAGE = "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=800&auto=format&fit=crop";

    // Master 50 US State List
    const ALL_US_STATES = [
      "AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA",
      "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD",
      "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ",
      "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC",
      "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"
    ];

    // DOM Elements
    const eventsGrid = document.getElementById('eventsGrid');
    const searchInput = document.getElementById('searchInput');
    const stateFilter = document.getElementById('stateFilter');
    const cityFilter = document.getElementById('cityFilter');
    const categoryFilter = document.getElementById('categoryFilter');
    const eventCount = document.getElementById('eventCount');

    // Populate State Filter Dropdowns
    function populateStateDropdowns(events) {
      stateFilter.innerHTML = '<option value="">All States (50 States)</option>';

      ALL_US_STATES.forEach(state => {
        const count = events.filter(e => e.state === state).length;
        
        const optFilter = document.createElement('option');
        optFilter.value = state;
        optFilter.textContent = count > 0 ? `${state} (${count} events)` : `${state}`;
        stateFilter.appendChild(optFilter);

      });
    }

    // Populate Dynamic Cities Dropdown based on Selected State
    function populateCityDropdown(events, selectedState = "") {
      cityFilter.innerHTML = '<option value="">All Cities</option>';

      let relevantEvents = events;
      if (selectedState) {
        relevantEvents = events.filter(e => e.state === selectedState);
      }

      const cities = [...new Set(relevantEvents.map(e => e.city).filter(Boolean))].sort();

      cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        cityFilter.appendChild(option);
      });
    }

    function safeUrl(value, fallback = '') {
      try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol) && !url.username && !url.password ? url.href : fallback;
      } catch { return fallback; }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    // Render Event Cards
    function renderEvents(filteredEvents) {
      eventsGrid.innerHTML = '';
      eventCount.textContent = `Showing ${filteredEvents.length} upcoming events`;

      if (filteredEvents.length === 0) {
        eventsGrid.innerHTML = `
          <div class="no-results">
            <h3>No events found</h3>
            <p>${eventsData.length ? "Try adjusting your filters." : "We are rebuilding the directory with verified dates and original event sources. No verified upcoming listings are available yet."}</p>
          </div>
        `;
        return;
      }

      filteredEvents.forEach(record => {
        const event = Object.fromEntries(Object.entries(record).map(([key, value]) => [key, escapeHtml(value)]));
        const imageUrl = escapeHtml(safeUrl(record.image, DEFAULT_FALLBACK_IMAGE));
        const sourceUrl = escapeHtml(safeUrl(record.url));
        const hasValidUrl = Boolean(sourceUrl);

        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <div class="card-image-wrapper">
            <span class="category-badge">${event.category || 'Car Meet'}</span>
            <img 
              src="${imageUrl}" 
              alt="${event.title}" 
              class="event-card-img"
              loading="lazy" decoding="async"
              onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_IMAGE}';"
            />
          </div>
          <div class="event-card-body">
            <h2 class="event-title">${event.title}</h2>
            <div class="meta-row">
              📅 <strong>${event.date}${event.end_date && event.end_date !== event.date ? ' – ' + event.end_date : ''}</strong> &bull; ${event.time || 'See Details'}
            </div>
            <div class="meta-row">
              📍 <strong>${event.city}, ${event.state}</strong> &bull; ${event.venue}
            </div>
            <p class="event-description">${event.description || 'No additional event details provided.'}</p>
            <div class="card-footer">
              ${event.source ? `<p class="event-description">Source: ${event.source} · Checked ${event.verified_at} UTC</p>` : ''}
              ${hasValidUrl ? `
                <a href="${sourceUrl}" target="_blank" rel="noopener noreferrer" class="event-link-btn">
                  View Original Event Listing &rarr;
                </a>
              ` : `
                <span class="event-link-btn" style="opacity: 0.6; cursor: default; background: transparent;">
                  Community Schedule Entry
                </span>
              `}
            </div>
          </div>
        `;
        eventsGrid.appendChild(card);
      });
    }

    // Real-Time Filter Engine
    function filterEvents() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedState = stateFilter.value;
      const selectedCity = cityFilter.value;
      const selectedCategory = categoryFilter.value;

      const filtered = eventsData.filter(event => {
        const matchesSearch = 
          !searchTerm ||
          (event.title && event.title.toLowerCase().includes(searchTerm)) ||
          (event.city && event.city.toLowerCase().includes(searchTerm)) ||
          (event.venue && event.venue.toLowerCase().includes(searchTerm)) ||
          (event.description && event.description.toLowerCase().includes(searchTerm));

        const matchesState = !selectedState || event.state === selectedState;
        const matchesCity = !selectedCity || event.city === selectedCity;
        const matchesCategory = !selectedCategory || event.category === selectedCategory;

        return matchesSearch && matchesState && matchesCity && matchesCategory;
      });

      renderEvents(filtered);
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const today = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
      eventsData = eventsData.filter(event => /^\d{4}-\d{2}-\d{2}$/.test(event.date) && (event.end_date || event.date) >= today)
        .sort((a, b) => a.date.localeCompare(b.date));
      populateStateDropdowns(eventsData);
      document.getElementById('coverageSummary').textContent = `${new Set(eventsData.map(event => event.state)).size} of 50 states with listings · Source: SCCA`;
      populateCityDropdown(eventsData);
      renderEvents(eventsData);

      searchInput.addEventListener('input', filterEvents);
      
      stateFilter.addEventListener('change', () => {
        populateCityDropdown(eventsData, stateFilter.value);
        filterEvents();
      });

      cityFilter.addEventListener('change', filterEvents);
      categoryFilter.addEventListener('change', filterEvents);
    });
  </script>
