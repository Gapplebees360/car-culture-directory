<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA Auto Meets | National Car Meets, Shows & Track Day Directory</title>
  <meta name="description" content="Find upcoming car meets, cars and coffee, drag racing, track days, and auto shows across all 50 states.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #14161d;
      --card-border: #232733;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --text-primary: #f0f2f5;
      --text-secondary: #9ba1b0;
      --badge-bg: #212530;
      --input-bg: #1c1f2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(180deg, #181b24 0%, var(--bg-color) 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 40px 20px 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent-red);
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Controls & Filters */
    .filter-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin: 30px 0;
    }

    @media (max-width: 768px) {
      .filter-bar {
        grid-template-columns: 1fr;
      }
    }

    .filter-bar input, .filter-bar select {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .filter-bar input:focus, .filter-bar select:focus {
      border-color: var(--accent-red);
    }

    .stats-summary {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Event Grid */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    .event-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-4px);
      border-color: #3b4254;
    }

    .card-image-wrapper {
      position: relative;
      width: 100%;
      height: 190px;
      background-color: #1a1d26;
      overflow: hidden;
    }

    .event-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: var(--accent-red);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .event-card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .event-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .meta-row strong {
      color: var(--text-primary);
    }

    .event-description {
      font-size: 0.88rem;
      color: #8a90a0;
      margin: 12px 0 18px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }

    .event-link-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 10px 16px;
      background-color: #212530;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .event-link-btn:hover {
      background-color: var(--accent-red);
      border-color: var(--accent-red);
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      color: var(--text-secondary);
    }

    footer {
      text-align: center;
      padding: 40px 20px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>USA <span>AUTO MEETS</span></h1>
    <p>Live national directory for car shows, drag racing, track days, and community meets across all 50 states.</p>
  </header>

  <main class="container">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search events by keyword, city, or venue..." />
      <select id="stateFilter">
        <option value="">All States (50 States)</option>
      </select>
      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Track / Drag">Track / Drag</option>
        <option value="Cars & Coffee">Cars & Coffee</option>
        <option value="Car Show">Car Show</option>
        <option value="Cruise Night">Cruise Night</option>
        <option value="Pop-Up Meet">Pop-Up Meet</option>
        <option value="Autocross">Autocross</option>
      </select>
    </div>

    <div class="stats-summary">
      <span id="eventCount">Loading upcoming events...</span>
      <span>Updated Daily</span>
    </div>

    <div class="events-grid" id="eventsGrid"></div>
  </main>

  <footer>
    <p>&copy; 2026 USAAutoMeets.com — Aggregated automotive event directory.</p>
  </footer>

  <script>
    // ------------------------------------------------------------------
    // AUTOMATED INGESTION TARGET (DO NOT ALTER LINE BELOW)
    // ------------------------------------------------------------------
    let eventsData = [
      {
        "title": "Pacific Raceways Friday Night Drag & Tune",
        "state": "WA",
        "city": "Kent",
        "venue": "Pacific Raceways",
        "category": "Track / Drag",
        "date": "2026-10-16",
        "time": "04:00 PM - 10:00 PM",
        "description": "Quarter-mile street legal drag test & tune session.",
        "url": "https://pacificraceways.com/drag-racing/",
        "image": "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=800&auto=format&fit=crop"
      },
      {
        "title": "Griot's Garage Tacoma Caffeine & Gasoline",
        "state": "WA",
        "city": "Tacoma",
        "venue": "3333 S 38th St",
        "category": "Cars & Coffee",
        "date": "2026-10-17",
        "time": "08:00 AM - 10:00 AM",
        "description": "Flagship store cars & coffee with free coffee and car community build displays.",
        "url": "https://griotsgarage.com",
        "image": "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800&auto=format&fit=crop"
      }
    ];

    const DEFAULT_FALLBACK_IMAGE = "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=800&auto=format&fit=crop";

    // Master 50 US State List
    const ALL_US_STATES = [
      "AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA",
      "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD",
      "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ",
      "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC",
      "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"
    ];

    // DOM Elements
    const eventsGrid = document.getElementById('eventsGrid');
    const searchInput = document.getElementById('searchInput');
    const stateFilter = document.getElementById('stateFilter');
    const categoryFilter = document.getElementById('categoryFilter');
    const eventCount = document.getElementById('eventCount');

    // Populate State Filter Dropdown with All 50 States
    function populateStateDropdown(events) {
      stateFilter.innerHTML = '<option value="">All States (50 States)</option>';
      
      ALL_US_STATES.forEach(state => {
        const option = document.createElement('option');
        option.value = state;
        const count = events.filter(e => e.state === state).length;
        option.textContent = count > 0 ? `${state} (${count} events)` : `${state}`;
        stateFilter.appendChild(option);
      });
    }

    // Render Event Cards
    function renderEvents(filteredEvents) {
      eventsGrid.innerHTML = '';
      eventCount.textContent = `Showing ${filteredEvents.length} upcoming events`;

      if (filteredEvents.length === 0) {
        eventsGrid.innerHTML = `
          <div class="no-results">
            <h3>No events found</h3>
            <p>Try adjusting your search query, state, or category filters.</p>
          </div>
        `;
        return;
      }

      filteredEvents.forEach(event => {
        const imageUrl = (event.image && event.image !== '#') ? event.image : DEFAULT_FALLBACK_IMAGE;
        const hasValidUrl = event.url && event.url !== '#';

        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <div class="card-image-wrapper">
            <span class="category-badge">${event.category || 'Car Meet'}</span>
            <img 
              src="${imageUrl}" 
              alt="${event.title}" 
              class="event-card-img"
              onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_IMAGE}';"
            />
          </div>
          <div class="event-card-body">
            <h2 class="event-title">${event.title}</h2>
            <div class="meta-row">
              📅 <strong>${event.date}</strong> &bull; ${event.time || 'See Details'}
            </div>
            <div class="meta-row">
              📍 <strong>${event.city}, ${event.state}</strong> &bull; ${event.venue}
            </div>
            <p class="event-description">${event.description || 'No additional event details provided.'}</p>
            <div class="card-footer">
              ${hasValidUrl ? `
                <a href="${event.url}" target="_blank" rel="noopener noreferrer" class="event-link-btn">
                  View Original Event Listing &rarr;
                </a>
              ` : `
                <span class="event-link-btn" style="opacity: 0.6; cursor: default; background: transparent;">
                  Community Schedule Entry
                </span>
              `}
            </div>
          </div>
        `;
        eventsGrid.appendChild(card);
      });
    }

    // Real-Time Filter Engine
    function filterEvents() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedState = stateFilter.value;
      const selectedCategory = categoryFilter.value;

      const filtered = eventsData.filter(event => {
        const matchesSearch = 
          !searchTerm ||
          (event.title && event.title.toLowerCase().includes(searchTerm)) ||
          (event.city && event.city.toLowerCase().includes(searchTerm)) ||
          (event.venue && event.venue.toLowerCase().includes(searchTerm)) ||
          (event.description && event.description.toLowerCase().includes(searchTerm));

        const matchesState = !selectedState || event.state === selectedState;
        const matchesCategory = !selectedCategory || event.category === selectedCategory;

        return matchesSearch && matchesState && matchesCategory;
      });

      renderEvents(filtered);
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      populateStateDropdown(eventsData);
      renderEvents(eventsData);

      searchInput.addEventListener('input', filterEvents);
      stateFilter.addEventListener('change', filterEvents);
      categoryFilter.addEventListener('change', filterEvents);
    });
  </script>
</body>
</html>
