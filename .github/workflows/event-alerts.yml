name: Deliver consented local event alerts

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-alert-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deliver alerts if secure email configuration is ready
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
        run: python scripts/run_event_alerts.py
