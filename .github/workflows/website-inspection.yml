name: Inspect member-submitted event websites

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-refresh-refs/heads/main
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect queued sites and due recurring sources
        run: python scripts/process_website_submissions.py
      - name: Build current event pages and coverage
        run: |
          python scripts/sync_seo_moderation.py
          python scripts/update_events.py
          python scripts/coverage_report.py
      - name: Publish changed website events
        id: changes
        run: |
          if git diff --quiet -- events.json; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html coverage.json sitemap.xml seo-manifest.json seo-moderation.json website-import-report.json events/ states/ event-types/
          git commit -m "Import inspected automotive website events"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy changed directory through the regular publishing workflow
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-scraper.yml --ref main
