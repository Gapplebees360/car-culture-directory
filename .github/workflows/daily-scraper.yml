name: Daily Automotive Event Refresh

on:
  schedule:
    # Runs daily at 14:00 UTC (07:00 PDT)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Track Ingestion & Supabase Sync
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update_events.py

      - name: Commit & Push Changes
        run: |
          git config user.name "USA-Auto-Meets-Bot"
          git config user.email "bot@usautomeets.com"
          git add index.html
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update: Daily Facebook & MotorsportReg event refresh"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in index.html, skipping commit."
          fi
