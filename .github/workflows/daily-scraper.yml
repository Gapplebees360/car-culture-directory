name: Validate and Refresh Event Directory

on:
  schedule:
    - cron: '17 12 * * *' # UTC; local time changes with daylight saving.
  workflow_dispatch:
    inputs:
      facebook:
        description: 'Run paid 50-state Facebook search (maximum $5)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['events.json', 'index.html', 'assets/**', 'scripts/**', 'tests/**', '.github/workflows/daily-scraper.yml']
  pull_request:
    paths: ['events.json', 'index.html', 'assets/**', 'scripts/**', 'tests/**', '.github/workflows/daily-scraper.yml']

concurrency:
  group: event-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_events.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/frontend.cjs

  refresh-events:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import official SCCA calendar
        run: python scripts/import_scca.py

      - name: Import public Facebook events across 50 states
        if: github.event_name == 'workflow_dispatch' && inputs.facebook
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/import_facebook.py run --max-charge 5

      - name: Build validated event directory
        run: python scripts/update_events.py

      - name: Update combined source coverage
        run: python scripts/coverage_report.py

      - name: Commit and Push Updated index.html
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html events.json coverage.json
          if [ -f facebook-report.json ]; then git add facebook-report.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified upcoming events"
          git push origin HEAD:main

      - name: Prepare public site artifact
        run: |
          mkdir -p _site
          cp index.html car_culture_directory.html CNAME events.json coverage.json _site/
          cp -r assets _site/
          if [ -f facebook-report.json ]; then cp facebook-report.json _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy refreshed calendar
        id: deployment
        uses: actions/deploy-pages@v4
